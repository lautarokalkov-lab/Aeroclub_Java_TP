<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrarse</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="stylesheet" href="registrarseStyles.css" />
  </head>
  <body>
    <header>
      <div id="logo"></div>
    </header>
    <section id="contenido">
      <h1 id="titulo">Crear una Cuenta</h1>

      <div id="entradas">
        <input class="datos" type="text" placeholder="Email" id="mail" />
        <input
          class="datos"
          type="password"
          placeholder="Nueva Contraseña"
          id="contrasena"
        />
        <input
          class="datos"
          type="text"
          placeholder="Nro de Documento"
          id="documento"
        />
        <input class="datos" type="text" placeholder="Nombre" id="nombre" />
        <input class="datos" type="text" placeholder="Apellido" id="apellido" />
        <input
          class="datos"
          type="text"
          placeholder="Direccion"
          id="direccion"
        />
        <input class="datos" type="text" placeholder="Telefono" id="telefono" />
      </div>

      <div id="botones">
        <button type="submit" id="crear">Crear Usuario</button>
        <button type="submit" id="volver" r>Volver</button>
      </div>
    </section>
    <script src="registrarse.js"></script>
  </body>
</html>
