<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="stylesheet" href="loginStyles.css" />
  </head>
  <body>
    <header>
      <div id="logo"></div>
    </header>
    <section id="contenido">
      <h1 id="titulo">Iniciar Sesion</h1>

      <div id="entradas">
        <input type="text" placeholder="Email" id="usuario" />
        <input type="password" placeholder="Contraseña" id="contrasena" />
      </div>

      <div id="datoIncorrecto"></div>

      <div id="botones">
        <button type="submit" id="acceder">Acceder</button>
        <button type="submit" id="registrarse">Registrarse</button>
      </div>
    </section>
    <script src="login.js"></script>
  </body>
</html>
